<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peninsula Pessimist Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--desk:#efe6d6;--ink:#4a1010;--maroon:#6b0707;--coral:#f5442b;--cream:#f7d39b;--green:#4caf1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#260707;--ink:#f7d39b}}
:root[data-theme="dark"]{--desk:#260707;--ink:#f7d39b}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:760px;display:grid;gap:20px;justify-items:center}
.card{all:unset;display:block;width:100%;perspective:1600px;cursor:pointer;border-radius:18px}
.card:focus-visible{outline:3px solid var(--coral);outline-offset:6px}
.inner{display:grid;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;filter:drop-shadow(0 18px 24px rgba(40,0,0,.35))}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;border:3px solid var(--maroon)}
.front{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);aspect-ratio:7/4}
.logo{display:grid;place-items:center;padding:4%}
.logo img,.back img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
.info{background:var(--coral);color:#fff;padding:clamp(18px,4.5vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:20px;border-left:3px solid var(--maroon);text-align:left}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,7.5vw,3.7rem);line-height:.92;margin:0;letter-spacing:.02em}
.tag{margin:10px 0 0;font-size:clamp(.9rem,2.4vw,1.05rem);line-height:1.4;color:var(--cream);max-width:28ch}
address{font-style:normal;font-size:clamp(.85rem,2.2vw,1rem);line-height:1.7}
address a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5)}
address a:hover,address a:focus-visible{border-bottom-color:#fff;outline:none}
.back{transform:rotateY(180deg);background:var(--cream);display:grid;place-items:center;padding:4%}
.back img{max-width:420px}
.hint{margin:0;font-size:.9rem;opacity:.75}
@media (max-width:560px){
 .front{grid-template-columns:1fr;aspect-ratio:auto}
 .logo{padding:8% 14% 2%}
 .info{border-left:0;border-top:3px solid var(--maroon)}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head><body>
